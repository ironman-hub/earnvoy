version: "3.9"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: earnvoy
      POSTGRES_PASSWORD: earnvoy
      POSTGRES_DB: earnvoy
    ports:
      - "5432:5432"
    volumes:
      - earnvoy_db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - db
    env_file: ./backend/.env
    ports:
      - "4000:4000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  earnvoy_db_data:
